name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }}, ${{ matrix.neovim }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # v0.11.0 is the minimum version. Keep it in the matrix, so a call to a
        # newer API fails here and not on a user machine.
        os: [ubuntu-latest]
        neovim: [v0.11.0, stable, nightly]
        # The file watcher uses FSEvents on macOS and inotify on Linux. One
        # macOS job on stable tests the other watcher.
        include:
          - os: macos-latest
            neovim: stable
    steps:
      - uses: actions/checkout@v7

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Install jj
        env:
          JJ_VERSION: v0.46.0
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Linux) target="x86_64-unknown-linux-musl" ;;
            macOS) target="aarch64-apple-darwin" ;;
            *) echo "no jj archive for $RUNNER_OS" >&2; exit 1 ;;
          esac
          url="https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-${target}.tar.gz"
          # The archive holds "./jj", so it takes a whole extract and a move.
          # A named member fails when the release changes its layout.
          dir="$(mktemp -d)"
          curl --location --silent --show-error --fail "$url" | tar -xz -C "$dir"
          sudo install -m 0755 "$dir/jj" /usr/local/bin/jj
          rm -rf "$dir"
          jj --version

      - name: Show versions
        run: |
          nvim --version
          git --version
          jj --version

      - name: Run the tests
        run: make test

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check the format with stylua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0
          args: --check lua plugin tests

      - name: Lint with luacheck
        uses: lunarmodules/luacheck@v1
        with:
          args: lua plugin tests

      # The runner image holds shellcheck. Keep the glob the same as
      # SHELL_FILES in the Makefile.
      - name: Lint the skill scripts with shellcheck
        run: |
          shellcheck --version
          shellcheck skills/*/scripts/*
