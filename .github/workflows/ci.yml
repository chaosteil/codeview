name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.neovim }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # v0.11.0 is the minimum version. Keep it in the matrix, so a call to a
        # newer API fails here and not on a user machine.
        neovim: [v0.11.0, stable, nightly]
    steps:
      - uses: actions/checkout@v4

      - name: Install Neovim
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}

      - name: Install jj
        env:
          JJ_VERSION: v0.44.0
        run: |
          set -euo pipefail
          url="https://github.com/jj-vcs/jj/releases/download/${JJ_VERSION}/jj-${JJ_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          # The archive holds "./jj", so it takes a whole extract and a move.
          # A named member fails when the release changes its layout.
          dir="$(mktemp -d)"
          curl --location --silent --show-error --fail "$url" | tar -xz -C "$dir"
          sudo install -m 0755 "$dir/jj" /usr/local/bin/jj
          rm -rf "$dir"
          jj --version

      - name: Show versions
        run: |
          nvim --version
          git --version
          jj --version

      - name: Run the tests
        run: make test

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the format with stylua
        uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua plugin tests

      - name: Lint with luacheck
        uses: lunarmodules/luacheck@v1
        with:
          args: lua plugin tests
